<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryoOne · 30 роликов</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--night:#0D1220;--deep:#1B2540;--deep2:#232F50;--line:#2E3A5E;--gold:#E3B961;--paper:#E8E6E1;--mute:#9AA3BC;--red:#E07A6B;--green:#8FCB9B}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--paper);font:16px/1.5 Onest,system-ui,sans-serif}
a{color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(13,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;gap:18px;align-items:center;height:56px;overflow-x:auto;white-space:nowrap}
header.top b{color:var(--gold);font-weight:700}
header.top a{color:var(--mute);text-decoration:none;font-size:15px}
header.top a:hover{color:var(--paper)}
.logo{width:26px;height:26px;flex:none}
section{padding:40px 0 8px}
h1{font-size:34px;line-height:1.15;margin:34px 0 10px;font-weight:700}
h2{font-size:26px;margin:0 0 6px;font-weight:700}
h3{font-size:19px;margin:0 0 4px;font-weight:500}
.lead{color:var(--mute);margin:0 0 18px;max-width:760px}
.gold{color:var(--gold)}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--deep);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-size:24px;color:var(--gold)}
ul.plain{margin:6px 0;padding-left:18px}
ul.plain li{margin:3px 0}
/* стили */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.tab{background:var(--deep);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:500}
.tab .pick{margin-left:6px}
.stylehead{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:760px){.stylehead{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.pal{display:flex;gap:8px;margin:10px 0}
.sw{flex:1;border-radius:10px;height:52px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;border:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.shot{position:relative;border-radius:12px;overflow:hidden;background:var(--deep2);aspect-ratio:9/16;cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(13,18,32,.92));font-size:13px}
.shot.empty{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;cursor:default;text-align:center;padding:8px}
.btn{background:var(--gold);color:var(--night);border:0;border-radius:10px;padding:11px 16px;font:500 15px Onest,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 10px;font-size:14px}
.chosen{display:inline-block;background:var(--gold);color:var(--night);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:500}
.cmp{overflow-x:auto}
.cmp table{border-collapse:separate;border-spacing:8px;min-width:560px}
.cmp td{vertical-align:top;width:180px}
.cmp th{text-align:left;font-weight:500;color:var(--mute);font-size:14px}
.photo-vs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.photo-vs img{height:150px;border-radius:10px}
/* персонажи */
.pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pers .card{padding:10px}
.pers .shot{margin-bottom:8px}
.role{font-size:12px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--mute)}
.role.const{border-color:var(--gold);color:var(--gold)}
/* пачки */
.batch{margin:22px 0 30px}
.bhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{background:var(--deep2);border-radius:999px;padding:4px 11px;font-size:14px}
.chip b{color:var(--gold);font-weight:500}
.roll{background:var(--deep);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.roll.no{opacity:.55}
.rtop{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.rid{font-weight:700;color:var(--gold);min-width:42px}
.rt{flex:1;min-width:0}
.rt .t{font-weight:500}
.rt .m{font-size:13px;color:var(--mute)}
.yn{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.yn button{background:transparent;border:0;color:var(--mute);padding:6px 11px;font:14px Onest,sans-serif;cursor:pointer}
.yn button.on.y{background:var(--green);color:var(--night)}
.yn button.on.n{background:var(--red);color:var(--night)}
.rbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.roll.open .rbody{display:block}
.arrow{color:var(--mute);transition:transform .2s}
.roll.open .arrow{transform:rotate(90deg)}
.meta{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:14px;margin:12px 0}
.meta dt{color:var(--mute)}
.meta dd{margin:0}
.line{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.ava{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 22%;background:var(--deep2)}
.ava.live{outline:2px solid var(--gold);outline-offset:1px}
.who{font-size:13px;color:var(--mute)}
.who .sg{margin-left:6px;font-weight:700}
.sg.p{color:var(--green)}.sg.m{color:var(--red)}.sg.pm{color:var(--gold)}
.say{font-size:16px;margin:1px 0 3px}
.live .say{color:var(--gold)}
.scr{font-size:13px;color:var(--mute)}
.scr::before{content:"экран: ";color:#6f7896}
.brief{display:grid;grid-template-columns:70px 1fr;gap:6px 12px;margin:12px 0;font-size:15px}
.brief dt{color:var(--mute)}
.brief dd{margin:0}
select,textarea,input[type=text]{background:var(--night);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:14px Onest,sans-serif;width:100%}
textarea{min-height:60px;resize:vertical}
.swap{margin-top:10px}
.swap label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.note{margin-top:8px}
/* дзен */
.dz{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.dz .n{color:var(--mute)}
.dz .to{color:var(--gold);white-space:nowrap}
.dz .to.x{color:var(--mute);white-space:normal;max-width:180px;font-size:13px}
/* итог */
.bar{position:sticky;bottom:0;z-index:15;background:rgba(27,37,64,.97);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.bar .sum{flex:1;font-size:14px;color:var(--mute);min-width:200px}
.bar .sum b{color:var(--paper)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--gold);color:var(--night);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
footer{color:var(--mute);font-size:13px;padding:30px 0 90px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img class="logo" src="logo.png" alt="">
  <b>30 роликов</b>

</div></header>

<div class="bar"><div class="wrap">

</div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img alt=""></div>

 "text": "Там же, в Петербурге. Гарантия — двадцать четыре месяца, вдвое дольше рынка. Сервис приезжает к вам за один-три дня.", "role": "доказательство", "sign": "+", "screen": "плашки «гарантия 24 мес.» · «сервис — 1–3 дня»"}, {"who": "pr", "text": "Табличке верю. Но цех хочу увидеть сам.", "role": "качели", "sign": "±", "screen": "Предприниматель выключает фонарик"}, {"who": "dm", "text": "Приезжайте. Покажу цех, а потом зайдёте в капсулу сами.", "role": "финал", "sign": "+", "screen": "Дмитрий открывает дверцу капсулы · кнопка «Приезжайте на производство — напишите»"}]}, {"id": "1-02", "src": "Р03-1", "rub": "Сколько стоит", "t": "Что приезжает вместе с капсулой", "len": 56, "hook_plate": "Что входит в цену: 0 / 8", "chars": ["pr", "mn"], "idea": "Распаковка грузовика по накладной: счётчик «0 / 8» собирается на экране и висит до конца. Цена звучит только в конце, когда зритель уже видит, что за неё приезжает.", "cta": "Напишите — пришлём цены и комплектации", "live": "видео В11 (сосуд Дьюара) на «термос»; В16 (валенки) на «валенки»", "dv": [5, "6"], "lines": [{"who": "pr", "text": "Привезли криокапсулу. А в кузове ещё коробки. Это что, всё моё?", "role": "хук", "sign": "−", "screen": "Грузовик с золотой снежинкой у салона, коробки до потолка · плашка «Что входит в цену: 0 / 8»"}, {"who": "mn", "text": "Ваше. Я менеджер CryoOne, разбираем по накладной.", "role": "поворот", "sign": "±", "screen": "Менеджер с планшетом · счётчик «0 / 8»"}, {"who": "mn", "text": "Первое — сама капсула: в ней ваш гость две-три минуты бодрится холодом минус сто восемьдесят.", "role": "приём", "sign": "+", "screen": "капсула выезжает из кузова · счётчик «1 / 8» · плашка «2–3 минуты · −180 °C»"}, {"who": "mn", "text": "Второе — вот этот большой термос. Сосуд Дьюара: в нём хранят жидкий азот, азот и даёт холод.", "role": "приём", "sign": "+", "screen": "живое видео В11: сосуд крупно · счётчик «2 / 8»"}, {"who": "pr", "text": "Термос понял. А в этом мешке что?", "role": "качели", "sign": "−", "screen": "Предприниматель вытаскивает мягкий мешок"}, {"who": "mn", "text": "Третье — валенки и варежки для гостей. Четвёртое — пульт управления.", "role": "приём", "sign": "+", "screen": "живое видео В16 · валенки, варежки, пульт · счётчик «4 / 8»"}, {"who": "pr", "text": "А собирать кто будет? У меня одна отвёртка, и та от очков.", "role": "качели", "sign": "−", "screen": "Предприниматель с крошечной отвёрткой над огромной коробкой"}, {"who": "mn", "text": "Соберём мы. Пятое — монтаж: наши сборщики ставят капсулу за один день. Шестое — обучение вашего администратора, пятнадцать минут.", "role": "доказательство", "sign": "+", "screen": "сборщики CryoOne с инструментом · счётчик «6 / 8» · плашки «монтаж — 1 день» · «обучение — 15 минут»"}, {"who": "mn", "text": "Седьмое — гарантия двадцать четыре месяца. Восьмое — поставщиков азота в вашем городе ищем мы.", "role": "приём", "sign": "+", "screen": "список целиком · счётчик «8 / 8»"}, {"who": "pr", "text": "Восемь пунктов. И во сколько мне обошёлся этот кузов?", "role": "петля", "sign": "−", "screen": "Предприниматель заглядывает в пустой кузов"}, {"who": "mn", "text": "Капсула — от двух с половиной миллионов рублей, окупается от шести месяцев. Цены по всем моделям пришлю списком.", "role": "доказательство", "sign": "+", "screen": "плашки «от 2,5 млн ₽» · «окупаемость — от 6 месяцев»"}, {"who": "pr", "text": "Два с половиной. Зато отвёртку покупать не придётся.", "role": "финал", "sign": "+", "screen": "Предприниматель ставит валенки на стойку администратора · список висит · кнопка «Напишите — пришлём цены и комплектации»"}]}, {"id": "1-03", "src": "Р03-4", "rub": "Сколько стоит", "t": "Платёж — одна-две процедуры в день", "len": 52, "hook_plate": "Сколько гостей — на платёж?", "chars": ["pr", "dm", "mn"], "idea": "Страшную сумму переводим в людей, которые и так ходят в студию: «двое из сорока». Рассрочка и лизинг — да, сумму платежа в кадр не выводим.", "cta": "Напишите — посчитаем платёж под ваш город и модель", "live": "видео В05 (гостья в капсуле: «комфортно, нормально») на «выходит бодрым»", "dv": [7, "7"], "lines": [{"who": "pr", "text": "Через мою студию в день проходит сорок человек. Сколько из них должны зайти в криокапсулу, чтобы она сама за себя платила?", "role": "хук", "sign": "±", "screen": "Предприниматель у стойки, мимо идут гости, над дверью счётчик «40» · плашка «Сколько гостей — на платёж?»"}, {"who": "dm", "text": "Посчитаем. Сеанс в капсуле — две-три минуты холода: гости идут за бодростью, крепким сном и подтянутой кожей. Платят за это от двух с половиной до шести тысяч рублей.", "role": "поворот", "sign": "+", "screen": "Дмитрий с блокнотом · живое видео В05 · плашка «сеанс — 2 500–6 000 ₽»"}, {"who": "pr", "text": "Но саму капсулу надо оплатить сразу. Целиком.", "role": "качели", "sign": "−", "screen": "Предприниматель выворачивает пустой карман"}, {"who": "mn", "text": "Я менеджер CryoOne. Сразу — необязательно. Есть наша рассрочка, есть банк, есть лизинг. Если ничего не подходит — посчитаем схему под вас.", "role": "приём", "sign": "+", "screen": "Менеджер · плашка-список «рассрочка CryoOne · банк · лизинг · свой расчёт»"}, {"who": "pr", "text": "И сколько гостей нужно на такой платёж?", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на пустой календарь"}, {"who": "dm", "text": "Месячный платёж по рассрочке закрывают одна-две такие процедуры в день. Каждый следующий гость, за вычетом азота для капсулы, — уже ваш доход.", "role": "доказательство", "sign": "+", "screen": "в каждом дне календаря загораются две золотые снежинки, остальное — зелёным · плашка «платёж = 1–2 процедуры в день»"}, {"who": "pr", "text": "А если во вторник никто не придёт?", "role": "петля", "sign": "−", "screen": "Предприниматель смотрит на пустой вторник"}, {"who": "dm", "text": "Платёж месячный. Пустой вторник закроет суббота.", "role": "приём", "sign": "+", "screen": "в календаре суббота загорается четырьмя снежинками"}, {"who": "pr", "text": "Двое из сорока? У меня на утреннюю растяжку столько опаздывает.", "role": "финал", "sign": "+", "screen": "Предприниматель смеётся, в дверь вбегают двое опоздавших · кнопка «Напишите — посчитаем платёж под ваш город»"}]}, {"id": "1-04", "src": "Р12-1", "rub": "Азот без загадок", "t": "Вы и сейчас дышите азотом", "len": 52, "hook_plate": "3 страха про азот", "chars": ["pr", "dm"], "idea": "Разбор трёх страхов со штампом «проверено». На втором страхе предприниматель задерживает дыхание и держит его до конца ролика. Четвёртый вопрос — «где брать» — уходит в следующий ролик серии.", "cta": "Напишите город — найдём поставщиков азота рядом с вами", "live": "П23 (78 % воздуха), П25 (большой термос); видео В11 (сосуд Дьюара крупно)", "dv": [6, "7"], "lines": [{"who": "pr", "text": "Криокапсула работает на жидком азоте. Я про азот знаю три вещи: взрывается, травит и хранить его негде.", "role": "хук", "sign": "−", "screen": "Предприниматель пятится от сосуда · три карточки на стене · плашка «3 страха про азот»"}, {"who": "dm", "text": "Проверим все три. Сначала — зачем он. В кабине жидкий азот превращается в холодный пар, и гость две-три минуты стоит в этом паре при минус ста восьмидесяти.", "role": "поворот", "sign": "+", "screen": "Дмитрий со штампом «ПРОВЕРЕНО» · плашка «2–3 минуты · −180 °C»"}, {"who": "dm", "text": "Страх первый: рванёт. Азот не горит и не взрывается. Им даже тушат пожары.", "role": "приём", "sign": "+", "screen": "штамп на карточке «взрывается» · плашка «не горит · не взрывается»"}, {"who": "pr", "text": "Хорошо. А надышаться им можно?", "role": "качели", "sign": "−", "screen": "Предприниматель прикрывает нос"}, {"who": "live:П23", "text": "Мы с тобой дышим — сейчас вот в воздухе азота где-то порядка 78 %.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «78 % воздуха — азот»"}, {"who": "pr", "text": "Тогда я на всякий случай пока не дышу.", "role": "качели", "sign": "−", "screen": "Предприниматель надувает щёки и задерживает дыхание"}, {"who": "dm", "text": "Второй страх тоже мимо, дышите. Голова гостя в капсуле всегда над паром: он дышит тем же воздухом комнаты, что и вы. Страх третий: где азот держать.", "role": "приём", "sign": "±", "screen": "штамп на второй карточке · схема: голова над паром · предприниматель всё ещё не дышит"}, {"who": "live:П25", "text": "И жидкий азот, он хранится в сосудах Дьюара — это такой большой термос.", "role": "доказательство", "sign": "+", "screen": "живое видео В11: сосуд крупно"}, {"who": "dm", "text": "Сосуд стоит рядом с капсулой. Бочек в подвале не будет.", "role": "приём", "sign": "+", "screen": "штамп на третьей карточке · плашка «сосуд — рядом с капсулой»"}, {"who": "pr", "text": "А где… его… брать?", "role": "петля", "sign": "−", "screen": "Предприниматель, красный, говорит сквозь надутые щёки"}, {"who": "dm", "text": "Заводы в вашем городе обзвоним мы и пришлём список. А теперь выдыхайте.", "role": "финал", "sign": "+", "screen": "Предприниматель шумно выдыхает · три карточки со штампом · кнопка «Напишите город — найдём азот рядом»"}]}, {"id": "1-05", "src": "Р12-3", "rub": "Азот без загадок", "t": "Азот в вашем городе ищем мы", "len": 53, "hook_plate": "Где взять азот?", "chars": ["pr", "mn"], "idea": "Квест «найди азот»: три звонка на заводы, три провала. Менеджер присылает готовый список. Финал возвращается к третьему заводу из хука.", "cta": "Напишите город — пришлём поставщиков азота рядом", "live": "видео В11 (сосуд Дьюара) на «сосуд»", "dv": [4, "5–6"], "lines": [{"who": "pr", "text": "Ищу жидкий азот. Три завода обзвонил. Первый не берёт трубку. Второй продаёт азот цистернами. Третий спросил, зачем мне азот.", "role": "хук", "sign": "−", "screen": "Предприниматель с телефоном, три зачёркнутых номера · плашка «Где взять азот?»"}, {"who": "pr", "text": "Говорю: для криокапсулы. А он: «Для чего?»", "role": "узнавание", "sign": "−", "screen": "на экране телефона — «вызов завершён»"}, {"who": "mn", "text": "Для того, чтобы гостей в кабине бодрил холод минус сто восемьдесят. Я менеджер CryoOne, и искать азот — наша работа.", "role": "поворот", "sign": "+", "screen": "Менеджер в гарнитуре · лого в углу"}, {"who": "pr", "text": "Ваша? Вы в Петербурге, а я за полторы тысячи километров.", "role": "качели", "sign": "−", "screen": "карта: Петербург и город далеко"}, {"who": "mn", "text": "Заводы в вашем регионе мы обзваниваем сами. И присылаем список: цена за литр, кто привезёт азот или где заправить сосуд — большой термос, который приходит с капсулой.", "role": "приём", "sign": "+", "screen": "плашка-список «цена за литр · кто привезёт · где заправить» · живое видео В11"}, {"who": "pr", "text": "А литр почём? Вдруг у нас он золотой.", "role": "качели", "sign": "−", "screen": "Предприниматель держит воображаемый золотой слиток"}, {"who": "mn", "text": "Смотря какой завод рядом: где-то литр стоит тридцать рублей, где-то триста. Поэтому до договора считаем, во что вам обойдётся один сеанс с вашим азотом.", "role": "доказательство", "sign": "+", "screen": "плашка «30–300 ₽ за литр» · Менеджер с ноутбуком · плашка «Расчёт сеанса — до договора»"}, {"who": "pr", "text": "Список беру. А третьему заводу перезвоню — теперь объясню ему, для чего.", "role": "финал", "sign": "+", "screen": "Предприниматель набирает номер, улыбаясь · кнопка «Напишите город — пришлём поставщиков»"}]}, {"id": "1-06", "src": "Р13-1 + Р13-2", "rub": "Помещение", "t": "Метр на два и обычная розетка", "len": 55, "hook_plate": "Сколько места нужно?", "chars": ["pr", "dm"], "idea": "Предприниматель обвёл на полу скотчем место под капсулу — как на месте преступления. Габариты и розетка — живым голосом Дмитрия; фикус уезжает в коридор.", "cta": "Пришлите размеры комнаты — нарисуем план с капсулой", "live": "П21 (метр на два, 2,20), П27 (розетка, 1,5 кВт); видео В15 (капсула в комнате) на финале", "dv": [4, "7"], "lines": [{"who": "pr", "text": "Я обвёл на полу скотчем место под криокапсулу. Теперь гости спрашивают, кого тут нашли.", "role": "хук", "sign": "±", "screen": "контур из скотча на полу, как на месте преступления · плашка «Сколько места нужно?»"}, {"who": "dm", "text": "Никого. Здесь встанет криокапсула: гость заходит в неё на две-три минуты холода и выходит бодрым. Места ей нужно ровно столько.", "role": "поворот", "sign": "+", "screen": "Дмитрий у контура · плашка «2–3 минуты · −180 °C»"}, {"who": "live:П21", "text": "Оборудование под себя занимает метр на два, в высоту оно 2,20, поэтому даже можно поставить, не знаю, в какую-нибудь хрущёвку без проблем.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашки «1 × 2 м», «высота 2,20 м»"}, {"who": "pr", "text": "Метр на два нашёл, там фикус. Но электрик говорит, под такую штуку надо тянуть отдельную линию.", "role": "качели", "sign": "−", "screen": "Предприниматель у огромного фикуса, электрик с мотком кабеля"}, {"who": "live:П27", "text": "Оборудование включается в обычную бытовую розетку, туда, куда мы можем включить чайник… потребляемая мощность полтора киловатта.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «обычная розетка · 1,5 кВт»"}, {"who": "pr", "text": "Полтора киловатта? Мой фен в подсобке берёт больше.", "role": "качели", "sign": "±", "screen": "Электрик молча уносит кабель"}, {"who": "pr", "text": "А сосуд с азотом куда? Ему тоже угол нужен?", "role": "петля", "sign": "−", "screen": "Предприниматель оглядывает тесную комнату"}, {"who": "dm", "text": "Сосуд ставят рядом с капсулой. Поэтому комнату советуем от восьми квадратных метров: капсула, сосуд и место, где гость переоденется.", "role": "приём", "sign": "+", "screen": "план комнаты сверху · плашка «комната от 8 м²»"}, {"who": "pr", "text": "Значит, фикус едет в коридор. А скотч оставлю — пусть гадают.", "role": "финал", "sign": "+", "screen": "фикус выезжает, в контуре встаёт капсула · живое видео В15 · кнопка «Пришлите размеры — нарисуем план»"}]}, {"id": "1-07", "src": "Р13-3 + Р13-4", "rub": "Помещение", "t": "Пять проверок комнаты до ремонта", "len": 58, "hook_plate": "Сохраните: 5 проверок", "chars": ["dm", "pr", "mn"], "idea": "Дмитрий врывается с криком «Стоп!», когда ремонт уже сделан. Пять проверок собираются на экране и висят до конца; пятая придержана — предприниматель боится, что придётся снимать плитку. Площадь и розетка — в 1-06, здесь их нет.", "cta": "Пришлите фото и размеры комнаты — нарисуем план", "live": "видео В15 (капсула в комнате) на пятом пункте", "dv": [5, "5–6"], "lines": [{"who": "dm", "text": "Стоп! Не натягивайте потолок под криокапсулу, пока не проверите комнату.", "role": "хук", "sign": "−", "screen": "Дмитрий вбегает с рулеткой · плашка «Сохраните: 5 проверок»"}, {"who": "pr", "text": "Поздно. Потолок натянул, плитку положил. Завтра привозят.", "role": "узнавание", "sign": "−", "screen": "свежий ремонт, предприниматель с валиком"}, {"who": "dm", "text": "Тогда проверим, что вышло. А кто ещё не начал — сохраните пять пунктов.", "role": "поворот", "sign": "+", "screen": "Дмитрий раскрывает рулетку · счётчик «0 / 5»"}, {"who": "dm", "text": "Первое — потолок от двух метров тридцати. Капсула сама два двадцать, ей нужен запас.", "role": "приём", "sign": "+", "screen": "список: «потолок от 2,30 м» · счётчик «1 / 5»"}, {"who": "pr", "text": "А натяжной у меня на двух двадцати пяти.", "role": "качели", "sign": "−", "screen": "Предприниматель меряет рулеткой, лицо вытягивается"}, {"who": "dm", "text": "Значит, потолок поднимаем или берём модель для низких потолков. Второе — дверь от восьмидесяти сантиметров: капсулу заносят частями.", "role": "приём", "sign": "+", "screen": "список: «дверь от 80 см» · счётчик «2 / 5»"}, {"who": "dm", "text": "Третье — ровный пол. Четвёртое — сухо: влажность до шестидесяти процентов, иначе нужен осушитель.", "role": "приём", "sign": "+", "screen": "список: «ровный пол» · «влажность до 60 %» · счётчик «4 / 5»"}, {"who": "pr", "text": "А пятое? Только не говорите, что плитку снимать.", "role": "петля", "sign": "−", "screen": "Предприниматель обнимает свежую плитку"}, {"who": "dm", "text": "Плитка остаётся. Пятое — воздух, чтобы холодный пар из капсулы выветривался. Хватит окна, а нет окна — в стену ставят приточный клапан.", "role": "доказательство", "sign": "+", "screen": "список: «окно или приточный клапан» · счётчик «5 / 5» · живое видео В15"}, {"who": "mn", "text": "Я менеджер CryoOne. Пришлите фото и размеры комнаты — нарисую план: где встанет капсула и куда откроется дверь.", "role": "приём", "sign": "+", "screen": "Менеджер показывает план комнаты с капсулой · список висит"}, {"who": "pr", "text": "Потолок подниму. Плитку оставлю. Хоть что-то я сделал правильно.", "role": "финал", "sign": "+", "screen": "Предприниматель гладит плитку · кнопка «Пришлите фото — нарисуем план»"}]}, {"id": "1-08", "src": "Р14-1 + Р14-2", "rub": "Кто будет вести процедуру", "t": "Обучение за 15 минут", "len": 56, "hook_plate": "Обучение — 15 минут", "chars": ["ad", "dm", "kl"], "idea": "Таймер обучения на 15 минут тикает весь ролик — петля. Администратор засекает время сама и укладывается в 11 минут, запустив первую гостью.", "cta": "Напишите — расскажем, как проходит обучение", "live": "П35 (пульт как от телевизора); видео В16 (валенки надевают), В08 (оператор с пультом)", "dv": [5, "7"], "lines": [{"who": "ad", "text": "Мне сказали: через пятнадцать минут ты ведёшь процедуры в криокапсуле. Засекаю.", "role": "хук", "sign": "−", "screen": "Администратор нажимает секундомер «15:00» · плашка «Обучение — 15 минут»"}, {"who": "dm", "text": "Успеем. Я Дмитрий, CryoOne. Гость заходит в кабину, вы закрываете дверцу, две-три минуты холода — и он выходит бодрым. Ваше дело — встретить, одеть и запустить.", "role": "поворот", "sign": "+", "screen": "Дмитрий рядом, добродушно · таймер «13:40»"}, {"who": "ad", "text": "Одеть? Во что?", "role": "качели", "sign": "−", "screen": "Администратор растерянно смотрит на капсулу"}, {"who": "dm", "text": "Гость в белье, на ногах валенки, на руках варежки. Всё это лежит в комплекте.", "role": "приём", "sign": "+", "screen": "живое видео В16 · таймер «11:20»"}, {"who": "ad", "text": "А кнопок там много? Я с кофемашиной еле справляюсь.", "role": "качели", "sign": "−", "screen": "Администратор косится на пульт"}, {"who": "live:П35", "text": "Оборудование управляется с пульта дистанционного управления, как от телевизора пульт, есть минимум кнопок.", "role": "доказательство", "sign": "+", "screen": "живое видео В08: оператор с пультом · таймер «9:05»"}, {"who": "ad", "text": "А о чём с гостьей говорить все три минуты? Я же молчать не умею.", "role": "качели", "sign": "−", "screen": "Администратор шёпотом"}, {"who": "dm", "text": "И не молчите: капсула работает тихо, болтайте всю процедуру. Выйти гость может в любой момент: дверь изнутри открывается легче, чем снаружи. А что сказать перед входом — в памятке, она в комплекте.", "role": "приём", "sign": "+", "screen": "плашка «памятка для администратора — в комплекте» · таймер «6:30»"}, {"who": "ad", "text": "Ладно. Первая гостья, заходим.", "role": "петля", "sign": "±", "screen": "Администратор закрывает дверцу, жмёт кнопку · таймер «5:10»"}, {"who": "kl", "text": "Ой, холодно!.. Слушайте, а бодрит. Я ещё приду.", "role": "панч", "sign": "+", "screen": "Клиентка выходит из пара, сияет"}, {"who": "ad", "text": "Обучение — одиннадцать минут вместо пятнадцати. Четыре — на кофе.", "role": "финал", "sign": "+", "screen": "Администратор останавливает таймер «4:00» · кнопка «Напишите — расскажем про обучение»"}]}, {"id": "1-09", "src": "Р14-3", "rub": "Кто будет вести процедуру", "t": "Медика в штат искать не нужно", "len": 50, "hook_plate": "Кто будет вести процедуру?", "chars": ["pr", "ad", "dm"], "idea": "Вакансия «медобразование обязательно» висит три месяца, а администратор предлагает вычеркнуть два слова. Дмитрий объясняет, почему можно: тренажёрный комплекс, ОКВЭД подберёт юрист.", "cta": "Напишите — расскажем, кто и как ведёт процедуру", "live": "видео В03 (голос оператора: «если что-то будет некомфортно, обязательно говорим»)", "dv": [6, "7–8"], "lines": [{"who": "pr", "text": "Третий месяц висит вакансия: «Оператор криокапсулы, медобразование обязательно». Откликов — ноль.", "role": "хук", "sign": "−", "screen": "Предприниматель у доски с вакансией, по углам паутина · плашка «Кто будет вести процедуру?»"}, {"who": "ad", "text": "Так вычеркните последние два слова. Я ваш администратор, я бы и сама пошла.", "role": "поворот", "sign": "+", "screen": "Администратор из-за стойки, с маркером"}, {"who": "pr", "text": "Нельзя. Там же холод минус сто восемьдесят!", "role": "качели", "sign": "−", "screen": "Предприниматель закрывает вакансию собой"}, {"who": "dm", "text": "Можно. Я Дмитрий, CryoOne. Две-три минуты холода для бодрости — процедура не медицинская. Капсула сертифицирована как тренажёрный комплекс, как оборудование фитнес-зала. Поэтому ведёт её ваш администратор, мы его обучим.", "role": "приём", "sign": "+", "screen": "плашки «тренажёрный комплекс» · «без медобразования» · живое видео В03"}, {"who": "pr", "text": "А лицензии? Коды? Проверки?", "role": "петля", "sign": "−", "screen": "на предпринимателя падает гора папок"}, {"who": "dm", "text": "Нужен правильный код деятельности, ОКВЭД. Его подберёт наш юрист, он входит в покупку.", "role": "доказательство", "sign": "+", "screen": "папки разлетаются · плашка «ОКВЭД подберёт юрист CryoOne»"}, {"who": "pr", "text": "И сколько я буду всё это оформлять? Полгода?", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на календарь"}, {"who": "dm", "text": "Несколько дней. Пока капсулу собирают в цеху, бумаги уже готовы.", "role": "доказательство", "sign": "+", "screen": "плашка «оформление — несколько дней»"}, {"who": "pr", "text": "Снимаю вакансию.", "role": "качели", "sign": "+", "screen": "Администратор вычёркивает «медобразование обязательно»"}, {"who": "ad", "text": "А теперь давайте обсудим мою новую должность.", "role": "финал", "sign": "+", "screen": "Администратор с пультом, хитро улыбается · кнопка «Напишите — расскажем, кто ведёт процедуру»"}]}, {"id": "1-10", "src": "Р15-1 + П33", "rub": "Команда за спиной покупателя", "t": "Страшный сон: купил капсулу, а гостей нет", "len": 55, "hook_plate": "А если гостей не будет?", "chars": ["pr", "dm", "mn"], "idea": "Кошмар покупателя разбираем по частям, как сон: пустой зал, «свои уже всё попробовали», «я не маркетолог». Крио ставят в работающий бизнес, запуск ведут маркетологи.", "cta": "Напишите — расскажем, как ведём запуск", "live": "П33 («клиента не бросаем в чистом поле»)", "dv": [5, "7"], "lines": [{"who": "pr", "text": "Мне снится один сон. Я купил криокапсулу, а гостей нет. Она стоит в инее, и в ней живёт паук.", "role": "хук", "sign": "−", "screen": "Капсула в инее и паутине, пустой зал, эхо · плашка «А если гостей не будет?»"}, {"who": "dm", "text": "Просыпайтесь. Разберём ваш сон по частям.", "role": "поворот", "sign": "+", "screen": "Дмитрий щёлкает пальцами — паутина исчезает"}, {"who": "dm", "text": "Во сне капсула стоит в пустом зале. На деле её ставят туда, где люди уже ходят, и две-три минуты холода вы предлагаете своим же гостям.", "role": "приём", "sign": "+", "screen": "пустой зал наполняется гостями студии · плашка «крио — к работающему бизнесу»"}, {"who": "pr", "text": "Своих у меня двести. Они у меня уже всё перепробовали.", "role": "качели", "sign": "−", "screen": "Предприниматель листает базу гостей"}, {"who": "dm", "text": "Холода они у вас ещё не пробовали. Одно сообщение по базе — и у гостей, которые пропали, есть повод вернуться.", "role": "приём", "sign": "+", "screen": "плашка «одно сообщение по базе»"}, {"who": "pr", "text": "А новых где брать? Я не маркетолог.", "role": "качели", "sign": "−", "screen": "Предприниматель вздыхает"}, {"who": "mn", "text": "Я менеджер CryoOne, а за мной — наши маркетологи. Первый месяц созваниваемся каждую неделю и даём план: день открытых дверей, рассылка, сторис, где гости выходят из пара.", "role": "приём", "sign": "+", "screen": "плашка-список по неделям, пункты закрашиваются золотом"}, {"who": "pr", "text": "Месяц. А потом бросите?", "role": "петля", "sign": "−", "screen": "Предприниматель с недоверием"}, {"who": "live:П33", "text": "…клиента не бросаем в чистом поле.", "role": "доказательство", "sign": "+", "screen": "его кадр · лого"}, {"who": "dm", "text": "Студия растяжки в Калининграде тоже боялась пустого зала. А через месяц докупала сосуды для азота: гостей стало столько, что одного не хватало.", "role": "доказательство", "sign": "+", "screen": "карта: Калининград · сосуды приезжают вторым рейсом"}, {"who": "pr", "text": "Этот сон мне нравится больше.", "role": "финал", "sign": "+", "screen": "тот же зал — светлый, у капсулы очередь · кнопка «Напишите — расскажем про запуск»"}]}], "brief": [{"id": "2-01", "b": 2, "src": "Р05-3", "rub": "Доводы для главврача", "t": "Медсестёр не хватает. Процедуру ведёт один человек", "hook": "Помощник главврача: «Главврач сказал: новая процедура — только если под неё не нужен ни один новый человек».", "flow": "Приём — папка доводов, по листу на довод: что за процедура (2–3 минуты холода, гость выходит бодрым) → ведёт один сотрудник с пульта, обучение 15 минут (П34, П35) → тренажёрный комплекс, медобразование не нужно → продаётся сверх путёвки.", "end": "Помощник кладёт папку главврачу: «Ни одного нового человека. Как вы просили».", "chars": ["pg", "dm"], "live": "П34, П35", "cta": "Напишите — пришлём доводы для главврача"}, {"id": "2-02", "b": 2, "src": "Р05-4", "rub": "Доводы для главврача", "t": "Две капсулы ломались. Третья уже CryoOne", "hook": "Журнал отделения: страница за страницей одно слово — «ремонт».", "flow": "Кейс Соль-Илецка дневником: спрос на процедуру есть, а две капсулы другого производителя стоят → отделение объявляет тендер → выигрывает CryoOne, капсула проходит как тренажёрный комплекс → сервис за 1–3 дня, гарантия 24 месяца.", "end": "Новая запись в журнале: «Третья капсула. Работает». Дальше страницы пустые.", "chars": ["pg", "dm"], "live": "П38 (поддержка 24/7)", "cta": "Напишите — расскажем, как работает сервис", "note": "конкурентов не называем; кейс можно разбить на две серии: «почему меняли» и «как прошёл тендер»"}, {"id": "2-03", "b": 2, "src": "Р06-1", "rub": "Закупка до конца года", "t": "Деньги на оборудование есть, до декабря три месяца", "hook": "Помощник главврача: «Деньги на оборудование есть. Не потратим до декабря — заберут».", "flow": "Приём — обратный отсчёт, листки календаря слетают: производство от 20 рабочих дней → описание под модель и ТЗ для закупки пишет CryoOne → монтаж за день.", "end": "31 декабря: капсула стоит, помощник спокойно отрывает последний листок.", "chars": ["pg", "mn"], "live": "—", "cta": "Напишите — пришлём описание и ТЗ для закупки"}, {"id": "2-04", "b": 2, "src": "Р07-1", "rub": "Фитнес-клуб", "t": "Три сета — и в капсулу, завтра снова в зал", "hook": "Тренер: «После дня ног половина клиентов пропадает на три дня. Куда?»", "flow": "Разделённый экран: один клиент после ног лежит дома, абонемент простаивает → второй 2–3 минуты в капсуле, восстановление быстрее → завтра он в зале, у клуба — ещё одна строчка в чеке.", "end": "Тренер пишет в журнал: «Завтра снова ноги». Никто не сбежал.", "chars": ["tr", "kl"], "live": "П12 (восстановление)", "cta": "Напишите — посчитаем капсулу для вашего клуба"}, {"id": "2-05", "b": 2, "src": "Р07-2", "rub": "Фитнес-клуб", "t": "Два клуба через дорогу, тренажёры одинаковые", "hook": "Два клуба через дорогу: одни тренажёры, одни скидки. Клиенты уходят туда, где дешевле на сто рублей.", "flow": "Война скидок — оба в минусе → у одного появляется капсула: 2–3 минуты холода после тренировки → вторая строчка в чеке и причина выбрать этот клуб (Дзен №4).", "end": "Владелец клуба напротив в бинокль разглядывает пар из окна соседа.", "chars": ["pr", "tr"], "live": "статья Дзена №4", "cta": "Напишите — посчитаем, что капсула даст клубу"}, {"id": "2-06", "b": 2, "src": "Р08-2", "rub": "Спортивные команды", "t": "Двадцать игроков успевают, пока тренер разбирает игру", "hook": "Двадцать игроков, одна капсула, разбор игры — час. Успеют все?", "flow": "Команды первых дивизионов уже работают с CryoOne → процедура сразу после тренировки, для восстановления (П12) → 2–3 минуты на игрока, очередь идёт, пока тренер у доски.", "end": "Тренер: «Вопросы по игре?» Вся команда уже в валенках.", "chars": ["tr", "dm"], "live": "П11, П12", "cta": "Напишите — расскажем, как это устроено у команд"}, {"id": "2-07", "b": 2, "src": "Р09-1", "rub": "Капсула дома", "t": "Три минуты холода — час дороги. Или дверь за стеной", "hook": "Три минуты холода. Дорога до них — час.", "flow": "Разделённый экран: слева пробка, парковка, запись по времени → справа халат, дверь в соседнюю комнату, 2–3 минуты, «человек просто одевается и уходит» (П29) → дому хватит 8 м² и обычной розетки (П27).", "end": "Справа хозяин уже вышел из капсулы. Слева всё ещё ищут парковку.", "chars": ["pr", "dm"], "live": "В15 (капсула в доме), П27, П29", "cta": "Напишите — подберём капсулу для дома"}, {"id": "2-08", "b": 2, "src": "Р09-3", "rub": "Капсула дома", "t": "Подарок тому, у кого всё есть", "hook": "Друзья скинулись на подарок. Часы у него есть, машина есть. Что дальше?", "flow": "Список «уже есть» вычёркивается → выбирают капсулу → её не завернёшь в бумагу, поэтому CryoOne делает именной сертификат: модель, обивка под интерьер, монтаж, запуск (кейс «друзья подарили», П28).", "end": "Именинник держит сертификат и впервые не знает, что сказать.", "chars": ["pr", "kl"], "live": "В13 (бежевая капсула), П28", "cta": "Напишите — подберём цвет и обивку"}, {"id": "2-09", "b": 2, "src": "Р10-2", "rub": "Дизайнерам интерьеров", "t": "Спа-зона: сауна есть, хамам есть. Чего не хватает", "hook": "Дизайнер над проектом коттеджа: «Сауна, хамам, купель. Заказчик зевает».", "flow": "Капсула как предмет интерьера: цвет, фактура, обивка без логотипа (П28) → место под неё закладывают на стройке, как котельную или бассейн (кейс семьи из Подмосковья) → нужны 8 м², розетка и свежий воздух.", "end": "Заказчик впервые переспрашивает: «А это что?»", "chars": ["dz", "dm"], "live": "В15, П28", "cta": "Напишите — пришлём требования к помещению для проекта"}, {"id": "2-10", "b": 2, "src": "Р11-1", "rub": "Своё направление в регионе", "t": "В вашем городе капсулы ещё нет", "hook": "Карта России в золотых точках — от Калининграда до Сахалина. Ваш город — пустой.", "flow": "Кто в вашем городе купит процедуру: студии, клубы, санатории → вы продаёте и ведёте клиентов, завод собирает и привозит (П24) → регион можно обсудить.", "end": "На карте загорается ваша точка.", "chars": ["pr", "mn"], "live": "П24", "cta": "Напишите город — расскажем про дилерство"}, {"id": "3-01", "b": 3, "src": "Р01-3", "rub": "Доп-услуга в действующий бизнес", "t": "База, которая год молчит", "hook": "Администратор листает базу: двести гостей, последний визит — прошлой осенью.", "flow": "Скидки уже не зовут → одно сообщение: «У нас новое: две минуты холода, выходите бодрыми» → гости отвечают, потому что это новое → запись на неделю вперёд.", "end": "Телефон на стойке звонит раньше, чем администратор кладёт трубку.", "chars": ["ad", "pr"], "live": "В05", "cta": "Напишите — расскажем, как вернуть уснувшую базу"}, {"id": "3-02", "b": 3, "src": "Р01-5", "rub": "Доп-услуга в действующий бизнес", "t": "Гости сами снимают вашу рекламу", "hook": "Гостья в капсуле снимает сторис: пар, её лицо и ваш логотип.", "flow": "Эмоции «нельзя купить за деньги» (П17), «всё в парах, всё красиво» (П18) → гостья отмечает салон → подруги спрашивают, где это, и записываются.", "end": "Предприниматель смотрит на просмотры, за которые не платил.", "chars": ["kl", "pr"], "live": "П17, П18, В07", "cta": "Напишите — расскажем, как крио работает на рекламу"}, {"id": "3-03", "b": 3, "src": "Р02-1", "rub": "Окупаемость без сказок", "t": "Капсула — не курица с золотыми яйцами", "hook": "Предприниматель поставил капсулу и ждёт, когда из неё посыплются деньги.", "flow": "Дмитрий честно: «не курица, несущая золотые яйца» (П31) → «есть // сохранённое прошлой версией страницы: стиль, которого больше нет, ронял отрисовку — чистим
const IDS = DATA.styles.map(x => x.id);
if (st.view !== 'cmp' && !IDS.includes(st.view)) st.view = IDS[0];
if (st.style && !IDS.includes(st.style)) st.style = '';
for (const k of ['r', 'swap', 'note', 'q', 'open']) if (!st[k] || typeof st[k] !== 'object') st[k] = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} summary(); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const $ = s => document.querySelector(s);
const PN = Object.fromEntries(DATA.chars.map(c => [c.id, c.name]));
Object.assign(PN, {sb: 'Сборщик', pg: 'Помощник главврача', tr: 'Тренер', dz: 'Дизайнер'});
const img = (sty, id) => DATA.img[sty] && DATA.img[sty][id];
// режим «Сравнить рядом» (view = 'cmp') — не стиль: картинки персонажей и сценариев берём из существующего стиля
const curStyle = () => IDS.includes(st.style) ? st.style : IDS.includes(st.view) ? st.view : IDS[0];

function shot(sty, id, cap) {
  const src = img(sty, id);
  if (!src) return `<div class="shot empty">${esc(cap)}<br>не нарисовано</div>`;
  return `<div class="shot" data-full="${src}"><img loading="lazy" src="${src}" alt="${esc(cap)}"><div class="cap">${esc(cap)}</div></div>`;
}

function renderAnswer() {
  const a = DATA.answer;
  return `<section id="answer">
  <h1>30 роликов: стиль, персонажи, три пачки</h1>
  <p class="lead">Три стиля на выбор, пять персонажей, 30 роликов по неделям.
  Отмечай «да / нет», меняй ролик на запасной, пиши правки — всё сохраняется в браузере.
  Внизу — «Скопировать выбор».</p>
  <div class="facts">${a.facts.map(f => `<div class="fact"><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join('')}</div>
  <div class="grid2">
    <div class="card"><h3>Её ответы на вопросы</h3><ul class="plain">${a.said.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Что не отметила</h3><ul class="plain">${a.skipped.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  </div></section>`;
}

function renderIntro() {
  return `<section id="answer"><h1>30 роликов: стиль, персонажи, три пачки</h1>
  <p class="lead">Три стиля на выбор, пять персонажей, 30 роликов по неделям. Отмечай «да / нет», меняй ролик на запасной,
  пиши правки — всё сохраняется в браузере. Внизу — «Скопировать выбор».</p></section>`;
}

function renderStyles() {
  const v = st.view;
  const s = DATA.styles.find(x => x.id === v);
  const tabs = DATA.styles.map(x => `<button class="tab ${x.id === v ? 'on' : ''}" data-view="${x.id}">${esc(x.name)}${st.style === x.id ? ' <span class="pick">✓</span>' : ''}</button>`).join('')
    + `<button class="tab ${v === 'cmp' ? 'on' : ''}" data-view="cmp">Сравнить рядом</button>`;
  let body;
  if (v === 'cmp') {
    const rows = [['dm', 'Дмитрий'], ['dm_3', 'Дмитрий смеётся'], ['mn', 'Менеджер'], ['kl', 'Клиентка'], ['pr', 'Предприниматель'], ['ad', 'Администратор'], ['сцена_1', 'Сцена 1'], ['сцена_2', 'Сцена 2']];
    body = `<div class="cmp"><table><tr><th></th>${DATA.styles.map(x => `<th>${esc(x.name)}</th>`).join('')}</tr>
      ${rows.map(r => `<tr><th>${r[1]}</th>${DATA.styles.map(x => `<td>${shot(x.id, r[0], r[1])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  } else {
    const gal = DATA.gallery.map(g => shot(v, g[0], g[1])).join('');
    body = `<div class="stylehead">
      <div class="card"><h3>${esc(s.name)} <span class="mute small">· ${esc(s.tag)}</span></h3>
        <p>${esc(s.idea)}</p>
        <p><span class="gold">Почему:</span> ${esc(s.why)}</p>
        <p><span class="gold">Риск:</span> ${esc(s.risk)}</p>
        <p class="small"><span class="gold">Движение:</span> ${esc(s.motion)}</p>
        ${st.style === v ? '<span class="chosen">Выбран</span>' : `<button class="btn" data-pick="${v}">Берём этот стиль</button>`}
      </div>
      <div class="card"><h3>Карта стиля</h3>
        <dl class="kv">${s.look.map(l => `<dt>${esc(l[0])}</dt><dd>${esc(l[1])}</dd>`).join('')}</dl>
        <div class="pal">${DATA.palette.map(p => `<div class="sw" style="background:${p[1]};color:${p[0] === 'Золото' || p[0] === 'Бумага' ? '#0D1220' : '#E8E6E1'}">${p[0]}</div>`).join('')}</div>
        <dl class="kv small">${DATA.series.map(l => `<dt>${esc(l[0])}</dt><dd>${esc(l[1])}</dd>`).join('')}</dl>
      </div></div>
      <div class="gal">${gal}</div>
      ${DATA.flaws[v] ? `<p class="small mute">Брак проб: ${esc(DATA.flaws[v])}</p>` : ''}`;
  }
  return `<section id="styles"><h2>Три стиля</h2>
    <p class="lead">Первый — наш из ролика 2, два новых. Цвета, шрифты, титры и финал у всех одинаковые (К2) — меняется только рисовка.
    Дмитрий нарисован по кадрам подкаста: личных фото пока нет. Нос — меньше и аккуратнее, чем в первом образе.</p>
    <div class="photo-vs">${DATA.refs.map(r => `<img src="${r}" alt="кадр подкаста">`).join('')}<span class="small mute" style="align-self:end">← по этим кадрам</span></div>
    <div class="tabs">${tabs}</div>${body}</section>`;
}

function renderPers() {
  const sty = curStyle();
  return `<section id="pers"><h2>Персонажи</h2>
    <p class="lead">Постоянные — трое. Предприниматель и Администратор — эпизоды, но нужны уже в первой пачке.
    Картинки — в стиле «${esc(DATA.styles.find(x => x.id === sty).name)}».</p>
    <div class="pers">${DATA.chars.map(c => `<div class="card">${shot(sty, c.id, c.name)}
      <h3>${esc(c.name)} <span class="role ${c.role === 'постоянный' ? 'const' : ''}">${c.role}</span></h3>
      <div class="small">${esc(c.who)}</div><div class="small mute">${esc(c.char)}</div><div class="small gold">${esc(c.line)}</div></div>`).join('')}</div>
    <p class="small mute">${esc(DATA.later)}</p></section>`;
}

function yn(id) {
  const v = st.r[id] || '';
  return `<div class="yn"><button class="y ${v === 'y' ? 'on' : ''}" data-yn="${id}" data-v="y">да</button><button class="n ${v === 'n' ? 'on' : ''}" data-yn="${id}" data-v="n">нет</button></div>`;
}

function lineHtml(l) {
  const sty = curStyle();
  const live = l.who.startsWith('live:');
  const who = live ? 'dm' : l.who;
  const src = img(sty, live ? 'dm_3' : who) || '';
  const sg = l.sign === '+' ? 'p' : l.sign === '−' ? 'm' : 'pm';
  return `<div class="line ${live ? 'live' : ''}"><img class="ava ${live ? 'live' : ''}" src="${src}" alt="">
    <div><div class="who">${live ? 'Дмитрий · живой голос ' + esc(l.who.slice(5)) : esc(PN[who] || who)} · ${esc(l.role)}<span class="sg ${sg}">${esc(l.sign)}</span></div>
    <div class="say">${esc(l.text)}</div><div class="scr">${esc(l.screen)}</div></div></div>`;
}

function rollHtml(r, full) {
  const res = DATA.reserve[r.rub] || [];
  const open = st.open[r.id] ? 'open' : '';
  const no = st.r[r.id] === 'n' ? 'no' : '';
  const sw = st.swap[r.id];
  const meta = `<dl class="meta"><dt>Рубрика</dt><dd>${esc(r.rub)} · ${esc(r.src)}</dd>
    ${full && r.dv ? `<dt>Тупой зритель</dt><dd>${r.dv[0]} → <b class="gold">${r.dv[1]}</b> из 10 <span class="mute">(первая версия → сейчас, порог 8)</span></dd>` : ''}
    ${full ? `<dt>Длина</dt><dd>≈ ${r.len} с</dd><dt>Плашка хука</dt><dd>${esc(r.hook_plate)}</dd><dt>Замысел</dt><dd>${esc(r.idea)}</dd>` : ''}
    <dt>В кадре</dt><dd>${r.chars.map(c => esc(PN[c] || c)).join(', ')}</dd>
    <dt>Живое</dt><dd>${esc(r.live)}</dd><dt>Повод написать</dt><dd>${esc(r.cta)}</dd>
    ${r.note ? `<dt>Важно</dt><dd>${esc(r.note)}</dd>` : ''}</dl>`;
  const body = full ? r.lines.map(lineHtml).join('')
    : `<dl class="brief"><dt>Хук</dt><dd>${esc(r.hook)}</dd><dt>Ход</dt><dd>${esc(r.flow)}</dd><dt>Финал</dt><dd>${esc(r.end)}</dd></dl>`;
  return `<div class="roll ${open} ${no}" id="r_${r.id}">
    <div class="rtop" data-open="${r.id}"><span class="arrow">▸</span><span class="rid">${r.id}</span>
      <div class="rt"><div class="t">${esc(sw || r.t)}</div><div class="m">${esc(r.rub)}${full ? ' · ≈ ' + r.len + ' с' : ''}${sw ? ' · замена' : ''}</div></div>${yn(r.id)}</div>
    <div class="rbody">${meta}${body}
      ${res.length ? `<div class="swap"><label>Заменить на запасной из этой рубрики</label><select data-swap="${r.id}"><option value="">— оставить «${esc(r.t)}» —</option>${res.map(x => `<option ${sw === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>` : ''}
      <div class="note"><textarea data-note="${r.id}" placeholder="Правка к ролику">${esc(st.note[r.id] || '')}</textarea></div>
    </div></div>`;
}

function renderBatches() {
  return DATA.batches.map(b => {
    const rolls = b.n === 1 ? DATA.full.map(r => rollHtml(r, true)) : DATA.brief.filter(r => r.b === b.n).map(r => rollHtml(r, false));
    return `<section class="batch" id="b${b.n}"><div class="bhead"><h2>Пачка ${b.n} · ${esc(b.name)}</h2><span class="mute">${esc(b.when)}</span></div>
      <p class="lead">${esc(b.why)}${b.n === 1 ? ' Сценарии — целиком: реплики, кто говорит, что на экране.' : ' Кратко: хук, ход, финал — реплики после твоих правок к пачке 1.'}</p>
      <div class="chips">${b.rub.map(x => `<span class="chip">${esc(x[0])} <b>${x[1]}</b></span>`).join('')}</div>
      ${rolls.join('')}</section>`;
  }).join('');
}

function renderDzen() {
  return `<section id="dzen"><h2>Статьи Дзена — темы, которые берём</h2>
    <p class="lead">${DATA.dzen.length} из 30. Куда ушла тема — номер ролика; «—» — почему не взяли.</p>
    <div class="card">${DATA.dzen.map(d => `<div class="dz"><span class="n">${d.n}</span><span><a href="${d.url}" target="_blank" rel="noopener">${esc(d.title)}</a></span>
      <span class="to ${d.to ? '' : 'x'}">${d.to ? `<a href="#r_${d.to}" data-go="${d.to}">${d.to}</a>` : '— ' + esc(d.why)}</span></div>`).join('')}</div></section>`;
}

function renderQ() {
  return `<section id="q"><h2>Вопросы на завтра</h2><div class="grid2">${DATA.questions.map((q, i) => `<div class="card"><p style="margin-top:0">${esc(q)}</p>
    <textarea data-q="${i}" placeholder="Ответ">${esc(st.q[i] || '')}</textarea></div>`).join('')}</div></section>
    <footer>Собрано ${esc(DATA.built)}. </footer>`;
}

function render() {
  // каждый раздел — отдельно: ошибка в одном больше не оставляет страницу пустой (была одна шапка)
  const parts = [DATA.public ? renderIntro : renderAnswer, renderStyles, renderPers, renderBatches, renderDzen]
    .concat(DATA.public ? [] : [renderQ]);
  $('#app').innerHTML = parts.map(f => {
    try { return f(); } catch (e) { console.error(e); return `<section><p class="mute">Раздел не открылся: ${esc(e.message)}</p></section>`; }
  }).join('');
  summary();
}

function allRolls() { return DATA.full.concat(DATA.brief); }

function summary() {
  const rs = allRolls();
  const y = rs.filter(r => st.r[r.id] === 'y').length, n = rs.filter(r => st.r[r.id] === 'n').length;
  const s = st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран';
  $('#sum').innerHTML = `Стиль: <b>${esc(s)}</b> · роликов: <b>${y}</b> да, <b>${n}</b> нет из ${rs.length}`;
}

function text() {
  const L = ['CryoOne · 30 роликов — мой выбор', ''];
  L.push('Стиль: ' + (st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран'));
  DATA.batches.forEach(b => {
    L.push('', `Пачка ${b.n} · ${b.name}`);
    allRolls().filter(r => r.id.startsWith(b.n + '-')).forEach(r => {
      const v = st.r[r.id] === 'y' ? 'да' : st.r[r.id] === 'n' ? 'нет' : '—';
      L.push(`${r.id} [${v}] ${st.swap[r.id] ? st.swap[r.id] + ' (вместо «' + r.t + '»)' : r.t}`);
      if ((st.note[r.id] || '').trim()) L.push('   правка: ' + st.note[r.id].trim());
    });
  });
  const qa = DATA.questions.map((q, i) => [q, (st.q[i] || '').trim()]).filter(x => x[1]);
  if (qa.length) { L.push('', 'Ответы:'); qa.forEach(x => L.push('— ' + x[0], '  ' + x[1])); }
  return L.join('\n');
}

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1800); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-pick],[data-yn],[data-open],.shot[data-full],[data-go]');
  if (!t) return;
  if (t.dataset.view) { st.view = t.dataset.view; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset.pick) { st.style = t.dataset.pick; save(); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Стиль выбран'); }
  else if (t.dataset.yn) { e.stopPropagation(); const id = t.dataset.yn; st.r[id] = st.r[id] === t.dataset.v ? '' : t.dataset.v; save();
    const el = document.getElementById('r_' + id); el.querySelector('.yn').outerHTML = yn(id); el.classList.toggle('no', st.r[id] === 'n'); }
  else if (t.dataset.open) { const id = t.dataset.open; st.open[id] = !st.open[id]; save(); document.getElementById('r_' + id).classList.toggle('open', !!st.open[id]); }
  else if (t.dataset.go) { st.open[t.dataset.go] = true; save(); document.getElementById('r_' + t.dataset.go).classList.add('open'); }
  else if (t.dataset.full) { $('#lb img').src = t.dataset.full; $('#lb').classList.add('on'); }
});
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) st.note[t.dataset.note] = t.value;
  else if (t.dataset.q) st.q[t.dataset.q] = t.value;
  else return;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.swap) return;
  st.swap[t.dataset.swap] = t.value; save();
  const el = document.getElementById('r_' + t.dataset.swap);
  el.querySelector('.rt .t').textContent = t.value || allRolls().find(r => r.id === t.dataset.swap).t;
});
$('#copy').addEventListener('click', async () => {
  const s = text();
  try { await navigator.clipboard.writeText(s); toast('Скопировано'); }
  catch (e) { const a = document.createElement('textarea'); a.value = s; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); toast('Скопировано'); }
});
render();
</script>
</body>
</html>
