<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryoOne · 30 роликов</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0D1220;--deep:#1B2540;--deep2:#232F50;--line:#2E3A5E;--gold:#E3B961;--paper:#E8E6E1;--mute:#9AA3BC;--red:#E07A6B;--green:#8FCB9B}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--paper);font:16px/1.5 Onest,system-ui,sans-serif}
a{color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(13,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;gap:18px;align-items:center;height:56px;overflow-x:auto;white-space:nowrap}
header.top b{color:var(--gold);font-weight:700}
header.top a{color:var(--mute);text-decoration:none;font-size:15px}
header.top a:hover{color:var(--paper)}
.logo{width:26px;height:26px;flex:none}
section{padding:40px 0 8px}
h1{font-size:34px;line-height:1.15;margin:34px 0 10px;font-weight:700}
h2{font-size:26px;margin:0 0 6px;font-weight:700}
h3{font-size:19px;margin:0 0 4px;font-weight:500}
.lead{color:var(--mute);margin:0 0 18px;max-width:760px}
.gold{color:var(--gold)}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--deep);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-size:24px;color:var(--gold)}
ul.plain{margin:6px 0;padding-left:18px}
ul.plain li{margin:3px 0}
/* стили */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.tab{background:var(--deep);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:500}
.tab .pick{margin-left:6px}
.stylehead{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:760px){.stylehead{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.pal{display:flex;gap:8px;margin:10px 0}
.sw{flex:1;border-radius:10px;height:52px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;border:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.shot{position:relative;border-radius:12px;overflow:hidden;background:var(--deep2);aspect-ratio:9/16;cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(13,18,32,.92));font-size:13px}
.shot.empty{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;cursor:default;text-align:center;padding:8px}
.btn{background:var(--gold);color:var(--night);border:0;border-radius:10px;padding:11px 16px;font:500 15px Onest,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 10px;font-size:14px}
.chosen{display:inline-block;background:var(--gold);color:var(--night);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:500}
.cmp{overflow-x:auto}
.cmp table{border-collapse:separate;border-spacing:8px;min-width:560px}
.cmp td{vertical-align:top;width:180px}
.cmp th{text-align:left;font-weight:500;color:var(--mute);font-size:14px}
.photo-vs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.photo-vs img{height:150px;border-radius:10px}
/* персонажи */
.pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pers .card{padding:10px}
.pers .shot{margin-bottom:8px}
.role{font-size:12px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--mute)}
.role.const{border-color:var(--gold);color:var(--gold)}
/* пачки */
.batch{margin:22px 0 30px}
.bhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{background:var(--deep2);border-radius:999px;padding:4px 11px;font-size:14px}
.chip b{color:var(--gold);font-weight:500}
.roll{background:var(--deep);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.roll.no{opacity:.55}
.rtop{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.rid{font-weight:700;color:var(--gold);min-width:42px}
.rt{flex:1;min-width:0}
.rt .t{font-weight:500}
.rt .m{font-size:13px;color:var(--mute)}
.yn{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.yn button{background:transparent;border:0;color:var(--mute);padding:6px 11px;font:14px Onest,sans-serif;cursor:pointer}
.yn button.on.y{background:var(--green);color:var(--night)}
.yn button.on.n{background:var(--red);color:var(--night)}
.rbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.roll.open .rbody{display:block}
.arrow{color:var(--mute);transition:transform .2s}
.roll.open .arrow{transform:rotate(90deg)}
.meta{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:14px;margin:12px 0}
.meta dt{color:var(--mute)}
.meta dd{margin:0}
.line{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.ava{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 22%;background:var(--deep2)}
.ava.live{outline:2px solid var(--gold);outline-offset:1px}
.who{font-size:13px;color:var(--mute)}
.who .sg{margin-left:6px;font-weight:700}
.sg.p{color:var(--green)}.sg.m{color:var(--red)}.sg.pm{color:var(--gold)}
.say{font-size:16px;margin:1px 0 3px}
.live .say{color:var(--gold)}
.scr{font-size:13px;color:var(--mute)}
.scr::before{content:"экран: ";color:#6f7896}
.brief{display:grid;grid-template-columns:70px 1fr;gap:6px 12px;margin:12px 0;font-size:15px}
.brief dt{color:var(--mute)}
.brief dd{margin:0}
select,textarea,input[type=text]{background:var(--night);color:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:14px Onest,sans-serif;width:100%}
textarea{min-height:60px;resize:vertical}
.swap{margin-top:10px}
.swap label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.note{margin-top:8px}
/* дзен */
.dz{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.dz .n{color:var(--mute)}
.dz .to{color:var(--gold);white-space:nowrap}
.dz .to.x{color:var(--mute);white-space:normal;max-width:180px;font-size:13px}
/* итог */
.bar{position:sticky;bottom:0;z-index:15;background:rgba(27,37,64,.97);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.bar .sum{flex:1;font-size:14px;color:var(--mute);min-width:200px}
.bar .sum b{color:var(--paper)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--gold);color:var(--night);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
footer{color:var(--mute);font-size:13px;padding:30px 0 90px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img class="logo" src="logo.png" alt="">
  <b>30 роликов</b>
  <a href="#styles">Стили</a><a href="#pers">Персонажи</a>
  <a href="#b1">Пачка 1</a><a href="#b2">Пачка 2</a><a href="#b3">Пачка 3</a><a href="#dzen">Дзен</a>
</div></header>

<main class="wrap" id="app"></main>

<div class="bar"><div class="wrap">
  <div class="sum" id="sum"></div>
  <button class="btn" id="copy">Скопировать выбор</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img alt=""></div>

стяшкой · плашка «Кто делает капсулу»"}, {"who": "dm", "text": "Я. Дмитрий Зашихин, инженер-физик, двадцать лет в криотехнологиях. Капсулы собираем сами, в Петербурге.", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · подпись «Дмитрий Зашихин · основатель CryoOne» · плашка «20 лет в криотехнологиях»"}, {"who": "pr", "text": "А зачем она салону? Что там внутри происходит?", "role": "качели", "sign": "−", "screen": "Предприниматель заглядывает в капсулу"}, {"who": "dm", "text": "Гость две-три минуты стоит в холоде минус сто восемьдесят, голова снаружи. Выходит бодрым и ночью спит лучше. А у вас — новая процедура в прайсе, от двух с половиной тысяч рублей.", "role": "приём", "sign": "+", "screen": "плашки «2–3 минуты · −180 °C», «бодрость · сон лучше», «сеанс — от 2 500 ₽»"}, {"who": "pr", "text": "Минус сто восемьдесят… А вы сами холода не боитесь?", "role": "петля", "sign": "−", "screen": "Предприниматель с опаской"}, {"who": "live:П10", "text": "Я сам уже более года увлекаюсь моржеванием, вот всю эту зиму два раза в неделю нырял в прорубь.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «Прорубь — 2 раза в неделю»"}, {"who": "pr", "text": "Вы-то закалённый. А я выдержу?", "role": "качели", "sign": "−", "screen": "Предприниматель ёжится"}, {"who": "dm", "text": "Приезжайте на производство в Петербург. Зайдёте в капсулу сами — и решите.", "role": "финал", "sign": "+", "screen": "Дмитрий открывает дверцу капсулы, приглашает жестом · кнопка «Приезжайте на производство — напишите»"}]}, {"id": "1-02", "src": "Р03-1", "rub": "Сколько стоит", "t": "От 2,5 миллиона. Что внутри", "len": 50, "hook_plate": "Что входит в цену", "chars": ["pr", "dm"], "idea": "Цена звучит первой репликой, дальше на экране собирается список «что за эти деньги» — его сохраняют.", "cta": "Напишите — пришлём цены и комплектации", "live": "видео В08 (администратор с пультом) на «пульт»; фото комплекта: сосуд, пульт, валенки, варежки", "dv": [5, 6], "lines": [{"who": "pr", "text": "Два с половиной миллиона? За холодильник?", "role": "хук", "sign": "−", "screen": "Предприниматель тычет в ценник «от 2,5 млн» · плашка «Что входит в цену»"}, {"who": "dm", "text": "Это криокапсула. Гость стоит в ней две-три минуты при минус ста восьмидесяти и выходит бодрым. Сеанс у вас — от двух с половиной тысяч рублей. Смотрите, что входит в цену.", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · плашки «2–3 минуты · −180 °C», «сеанс — от 2 500 ₽»"}, {"who": "dm", "text": "Капсулу собираем в Петербурге, привозим и ставим за один день.", "role": "приём", "sign": "+", "screen": "список начинается: «производство СПб» · «доставка и монтаж — 1 день»"}, {"who": "pr", "text": "А работать на ней кто будет? Я?", "role": "качели", "sign": "−", "screen": "Предприниматель показывает на себя"}, {"who": "dm", "text": "Ваш администратор. Учим за пятнадцать минут: пульт там проще, чем от телевизора.", "role": "приём", "sign": "+", "screen": "живое видео В08 · список: «обучение — 15 минут»"}, {"who": "pr", "text": "А потом я с ней один на один остаюсь.", "role": "качели", "sign": "−", "screen": "Предприниматель обнял капсулу, лицо обречённое"}, {"who": "dm", "text": "Не остаётесь. Поставщика азота в вашем городе найдём мы. Маркетологи ведут запуск каждую неделю. Гарантия — двадцать четыре месяца.", "role": "приём", "sign": "+", "screen": "список: «азот — ищем мы» · «маркетологи на запуске» · «гарантия 24 мес.»"}, {"who": "pr", "text": "То есть холодильник мне ещё и гостей приведёт?", "role": "петля", "sign": "±", "screen": "Предприниматель с надеждой"}, {"who": "dm", "text": "Гостей приведёт реклама. Какая работает у салонов — покажут наши маркетологи.", "role": "финал", "sign": "+", "screen": "список целиком висит · кнопка «Напишите — пришлём цены и комплектации»"}]}, {"id": "1-03", "src": "Р03-4", "rub": "Сколько стоит", "t": "Платёж — одна-две процедуры в день", "len": 42, "hook_plate": "Платёж = 1–2 гостя в день", "chars": ["pr", "mn", "dm"], "idea": "Страшную сумму переводим в гостей. Рассрочка и лизинг — да, сумму платежа в кадр не выводим.", "cta": "Напишите — посчитаем платёж под ваш город и модель", "live": "В05 (клиентка в капсуле: «комфортно, нормально») на слове «гость»", "dv": [7, 6], "lines": [{"who": "pr", "text": "Два с половиной миллиона за криокапсулу? Сразу? Не потяну.", "role": "хук", "sign": "−", "screen": "Предприниматель пятится от капсулы · плашка «Платёж = 1–2 гостя в день»"}, {"who": "mn", "text": "Сразу и не нужно. Я из CryoOne, мы делаем эти капсулы. Есть рассрочка — наша и через банк. И лизинг.", "role": "поворот", "sign": "+", "screen": "Менеджер с ноутбуком · плашка-список «рассрочка CryoOne · банк · лизинг»"}, {"who": "pr", "text": "Так это ж каждый месяц платёж. Где я его возьму?", "role": "качели", "sign": "−", "screen": "Предприниматель хватается за голову"}, {"who": "dm", "text": "Давайте посчитаем в гостях. Гость стоит в капсуле две-три минуты. Сеанс у вас будет стоить от двух с половиной до шести тысяч рублей.", "role": "приём", "sign": "+", "screen": "Дмитрий пишет на салфетке · плашка «2 500–6 000 ₽ за сеанс»"}, {"who": "dm", "text": "Платёж по рассрочке закрывают одна-две процедуры в день. Каждый следующий гость — уже в плюс.", "role": "доказательство", "sign": "+", "screen": "живое видео В05 · плашка «Платёж = 1–2 процедуры в день»"}, {"who": "pr", "text": "Два гостя в день…", "role": "петля", "sign": "±", "screen": "Предприниматель считает на пальцах"}, {"who": "pr", "text": "Да у меня на маникюр два человека за час приходят!", "role": "финал", "sign": "+", "screen": "Предприниматель сияет · кнопка «Напишите — посчитаем платёж под ваш город»"}]}, {"id": "1-04", "src": "Р12-1", "rub": "Азот без загадок", "t": "Вы и сейчас дышите азотом", "len": 38, "hook_plate": "78% воздуха — азот", "chars": ["pr", "dm"], "idea": "Главный страх — «азот опасен» — снимаем физикой и шуткой: предприниматель задерживает дыхание и выдыхает в финале.", "cta": "Напишите город — найдём поставщиков азота рядом с вами", "live": "видео В11 (сосуд Дьюара крупно) на «термос»", "dv": [6, 7], "lines": [{"who": "pr", "text": "Криокапсула работает на жидком азоте? В моём салоне? А он не рванёт?", "role": "хук", "sign": "−", "screen": "Предприниматель пятится от сосуда · плашка «78% воздуха — азот»"}, {"who": "dm", "text": "Вы им дышите прямо сейчас: в воздухе вокруг нас азота — семьдесят восемь процентов.", "role": "поворот", "sign": "+", "screen": "Дмитрий спокойно · плашка «78 %» крупно"}, {"who": "pr", "text": "Тогда я пока не дышу.", "role": "качели", "sign": "−", "screen": "Предприниматель надул щёки, задержал дыхание"}, {"who": "dm", "text": "Дышите. Азот не горит, не взрывается и не ядовит. Им даже тушат огонь. А в капсуле жидкий азот даёт холод для процедуры.", "role": "приём", "sign": "+", "screen": "плашка-список «не горит · не взрывается · не ядовит»"}, {"who": "pr", "text": "А хранить его где? Бочку в подвал ставить?", "role": "петля", "sign": "−", "screen": "Предприниматель, всё ещё красный, не дышит"}, {"who": "dm", "text": "Бочка не нужна. Жидкий азот держат в сосуде Дьюара — по сути, в большом термосе. Он идёт в комплекте с капсулой.", "role": "доказательство", "sign": "+", "screen": "живое видео В11: сосуд Дьюара крупно · плашка «Сосуд — в комплекте»"}, {"who": "pr", "text": "Термос в комплекте? Всё, дышу.", "role": "финал", "sign": "+", "screen": "Предприниматель шумно выдыхает · кнопка «Напишите город — найдём азот рядом»"}]}, {"id": "1-05", "src": "Р12-3", "rub": "Азот без загадок", "t": "Азот в вашем городе ищем мы", "len": 44, "hook_plate": "Где брать азот", "chars": ["pr", "mn"], "idea": "Покупатель третий час ищет азот — менеджер присылает готовый список поставщиков с ценой.", "cta": "Напишите город — пришлём поставщиков азота рядом", "live": "видео В11 (сосуд) на «приедет и заправит»", "dv": [4, 5], "lines": [{"who": "pr", "text": "Я бы взял криокапсулу, но ей нужен жидкий азот. Завод в двух часах, продают оптом, трубку не берут.", "role": "хук", "sign": "−", "screen": "Предприниматель в телефоне, двадцать открытых вкладок · плашка «Где брать азот»"}, {"who": "mn", "text": "Не обзванивайте заводы сами. Поставщиков азота в вашем городе ищем мы, в CryoOne.", "role": "поворот", "sign": "+", "screen": "Менеджер в гарнитуре · лого в углу"}, {"who": "pr", "text": "И пришлёте список из интернета?", "role": "качели", "sign": "−", "screen": "Предприниматель скептически"}, {"who": "mn", "text": "Пришлю список: цена за литр, сколько до завода ехать и контакт человека, который приедет и заправит.", "role": "приём", "sign": "+", "screen": "плашка-список «цена за литр · сколько ехать · кто заправит» · живое видео В11"}, {"who": "pr", "text": "А если никто не привозит? Мне самому возить?", "role": "петля", "sign": "−", "screen": "Предприниматель вздыхает"}, {"who": "mn", "text": "Тогда сосуд возите сами — в списке будет, куда ехать. Цена литра зависит от завода рядом: где-то тридцать рублей, где-то триста.", "role": "приём", "sign": "+", "screen": "карта: ваш город и точка завода"}, {"who": "mn", "text": "А сколько выйдет процедура с вашей ценой азота — посчитаем до договора.", "role": "доказательство", "sign": "+", "screen": "Менеджер с ноутбуком · плашка «Расчёт — до договора»"}, {"who": "pr", "text": "Закрываю поиск. Жду список — и расчёт.", "role": "финал", "sign": "+", "screen": "Предприниматель закрывает вкладки · кнопка «Напишите город — пришлём поставщиков»"}]}, {"id": "1-06", "src": "Р13-1 + Р13-2", "rub": "Помещение", "t": "Встанет в угол, где фикус", "len": 40, "hook_plate": "1 × 2 метра", "chars": ["pr", "dm"], "idea": "Габариты и розетка — живым голосом Дмитрия с подкаста; предприниматель в тесном кабинете находит угол с фикусом.", "cta": "Пришлите размеры комнаты — нарисуем план с капсулой", "live": "П21 (метр на два, 2,20 — до слов про хрущёвку); видео В15 (капсула в комнате) на финале", "dv": [4, 6], "lines": [{"who": "pr", "text": "Хочу криокапсулу. Но у меня кабинет — три шага.", "role": "хук", "sign": "−", "screen": "Предприниматель в тесном кабинете, раскинул руки — упирается в стены · плашка «1 × 2 метра»"}, {"who": "dm", "text": "Криокапсула — кабина, где гость две-три минуты стоит в холоде, голова снаружи. Гостю — бодрость, вам — новая процедура в прайсе. А места ей нужно немного.", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · плашка «2–3 минуты · −180 °C»"}, {"who": "live:П21", "text": "Оборудование под себя занимает метр на два, в высоту оно 2,20.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашки «1 × 2 м» и «высота 2,20 м»"}, {"who": "pr", "text": "Метр на два… У меня там фикус стоит.", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на угол с огромным фикусом"}, {"who": "pr", "text": "А розетка особая? Щиток менять?", "role": "петля", "sign": "−", "screen": "Предприниматель смотрит на старый щиток"}, {"who": "dm", "text": "Розетка обычная, та же, что для чайника. Капсула берёт полтора киловатта — меньше, чем чайник.", "role": "доказательство", "sign": "+", "screen": "Дмитрий показывает на розетку · плашка «1,5 кВт — меньше чайника»"}, {"who": "pr", "text": "Значит, фикус — в коридор. Капсула — в угол.", "role": "финал", "sign": "+", "screen": "Предприниматель выносит фикус, в углу встаёт капсула · кнопка «Пришлите размеры — нарисуем план»"}]}, {"id": "1-07", "src": "Р13-3 + Р13-4", "rub": "Помещение", "t": "Пять пунктов про комнату — сохраните", "len": 50, "hook_plate": "Сохраните: 5 пунктов", "chars": ["pr", "dm", "mn"], "idea": "Шпаргалка: пункты собираются на экране и висят до конца. Последний придержан — петля.", "cta": "Пришлите фото и размеры комнаты — нарисуем план", "live": "видео В15 (капсула в комнате) на пункте «вытяжка — в комплекте»", "dv": [5, 7], "lines": [{"who": "pr", "text": "Делаю кабинет под криокапсулу. С чего начать ремонт?", "role": "хук", "sign": "−", "screen": "Предприниматель с рулеткой и валиком · плашка «Сохраните: 5 пунктов»"}, {"who": "dm", "text": "Капсула — кабина, где гость две-три минуты стоит в холоде. Комнате под неё нужно пять вещей — проверьте их до ремонта. Сохраните этот ролик.", "role": "поворот", "sign": "+", "screen": "Дмитрий · счётчик «0 / 5» в углу"}, {"who": "dm", "text": "Первое — площадь от восьми квадратных метров. Второе — потолок от двух метров тридцати.", "role": "приём", "sign": "+", "screen": "список: «от 8 м²» · «потолок от 2,30 м» · счётчик «2 / 5»"}, {"who": "pr", "text": "Два тридцать? У меня в кабинете два двадцать пять.", "role": "качели", "sign": "−", "screen": "Предприниматель меряет потолок рулеткой"}, {"who": "dm", "text": "Тогда нужна другая комната. Третье — ровный пол. Четвёртое — обычная розетка с заземлением.", "role": "приём", "sign": "+", "screen": "список: «ровный пол» · «розетка с заземлением» · счётчик «4 / 5»"}, {"who": "pr", "text": "А пятое — какой-нибудь подвох?", "role": "петля", "sign": "−", "screen": "Предприниматель насторожился"}, {"who": "dm", "text": "Пятое — окно или отверстие в стене. Во время процедуры в капсуле клубится холодный пар, вытяжка выводит его на улицу. Сама вытяжка — в комплекте.", "role": "доказательство", "sign": "+", "screen": "список: «отверстие под вытяжку» · «5 / 5» · живое видео В15"}, {"who": "mn", "text": "Я менеджер CryoOne. Пришлите фото комнаты — нарисуем план: где встанет капсула и куда открывается её дверь.", "role": "финал", "sign": "+", "screen": "Менеджер показывает план комнаты с капсулой · список висит · кнопка «Пришлите фото — нарисуем план»"}]}, {"id": "1-08", "src": "Р14-1 + Р14-2", "rub": "Кто будет вести процедуру", "t": "Обучение за 15 минут", "len": 50, "hook_plate": "Обучение — 15 минут", "chars": ["ad", "dm", "kl"], "idea": "Таймер обучения на 15 минут тикает весь ролик — петля. Администратор боится, а до конца таймера сама запускает первую гостью.", "cta": "Напишите — расскажем, как проходит обучение", "live": "П34 (обучение 15 минут), П35 (пульт как от телевизора), видео В08 (оператор с пультом)", "dv": [5, 7], "lines": [{" }

function yn(id) {
  const v = st.r[id] || '';

function lineHtml(l) {
  const sty = curStyle();
  const live = l.who.startsWith('live:');
  const who = live ? 'dm' : l.who;
  const src = img(sty, live ? 'dm_3' : who) || '';
  const sg = l.sign === '+' ? 'p' : l.sign === '−' ? 'm' : 'pm';
  return `<div class="line ${live ? 'live' : ''}"><img class="ava ${live ? 'live' : ''}" src="${src}" alt="">
    <div><div class="who">${live ? 'Дмитрий · живой голос ' + esc(l.who.slice(5)) : esc(PN[who] || who)} · ${esc(l.role)}<span class="sg ${sg}">${esc(l.sign)}</span></div>
    <div class="say">${esc(l.text)}</div><div class="scr">${esc(l.screen)}</div></div></div>`;
}

function rollHtml(r, full) {
  const res = DATA.reserve[r.rub] || [];
  const open = st.open[r.id] ? 'open' : '';
  const no = st.r[r.id] === 'n' ? 'no' : '';
  const sw = st.swap[r.id];
  const meta = `<dl class="meta"><dt>Рубрика</dt><dd>${esc(r.rub)} · ${esc(r.src)}</dd>

    ${full ? `<dt>Длина</dt><dd>≈ ${r.len} с</dd><dt>Плашка хука</dt><dd>${esc(r.hook_plate)}</dd><dt>Замысел</dt><dd>${esc(r.idea)}</dd>` : ''}
    <dt>В кадре</dt><dd>${r.chars.map(c => esc(PN[c] || c)).join(', ')}</dd>
    <dt>Живое</dt><dd>${esc(r.live)}</dd><dt>Повод написать</dt><dd>${esc(r.cta)}</dd>
    ${r.note ? `<dt>Важно</dt><dd>${esc(r.note)}</dd>` : ''}</dl>`;
  const body = full ? r.lines.map(lineHtml).join('')
    : `<dl class="brief"><dt>Хук</dt><dd>${esc(r.hook)}</dd><dt>Ход</dt><dd>${esc(r.flow)}</dd><dt>Финал</dt><dd>${esc(r.end)}</dd></dl>`;
  return `<div class="roll ${open} ${no}" id="r_${r.id}">
    <div class="rtop" data-open="${r.id}"><span class="arrow">▸</span><span class="rid">${r.id}</span>
      <div class="rt"><div class="t">${esc(sw || r.t)}</div><div class="m">${esc(r.rub)}${full ? ' · ≈ ' + r.len + ' с' : ''}${sw ? ' · замена' : ''}</div></div>${yn(r.id)}</div>
    <div class="rbody">${meta}${body}
      ${res.length ? `<div class="swap"><label>Заменить на запасной из этой рубрики</label><select data-swap="${r.id}"><option value="">— оставить «${esc(r.t)}» —</option>${res.map(x => `<option ${sw === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>` : ''}
      <div class="note"><textarea data-note="${r.id}" placeholder="Правка к ролику">${esc(st.note[r.id] || '')}</textarea></div>
    </div></div>`;
}

      <div class="chips">${b.rub.map(x => `<span class="chip">${esc(x[0])} <b>${x[1]}</b></span>`).join('')}</div>
      ${rolls.join('')}</section>`;
  }).join('');

function render() {

function allRolls() { return DATA.full.concat(DATA.brief); }

function summary() {
  const rs = allRolls();
  const y = rs.filter(r => st.r[r.id] === 'y').length, n = rs.filter(r => st.r[r.id] === 'n').length;
  const s = st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран';
  $('#sum').innerHTML = `Стиль: <b>${esc(s)}</b> · роликов: <b>${y}</b> да, <b>${n}</b> нет из ${rs.length}`;
}

function text() {
  const L = ['CryoOne · 30 роликов — мой выбор', ''];
  L.push('Стиль: ' + (st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран'));
  DATA.batches.forEach(b => {
    L.push('', `Пачка ${b.n} · ${b.name}`);
    allRolls().filter(r => r.id.startsWith(b.n + '-')).forEach(r => {
      const v = st.r[r.id] === 'y' ? 'да' : st.r[r.id] === 'n' ? 'нет' : '—';
      L.push(`${r.id} [${v}] ${st.swap[r.id] ? st.swap[r.id] + ' (вместо «' + r.t + '»)' : r.t}`);
      if ((st.note[r.id] || '').trim()) L.push('   правка: ' + st.note[r.id].trim());
    });
  });
  const qa = DATA.questions.map((q, i) => [q, (st.q[i] || '').trim()]).filter(x => x[1]);
  if (qa.length) { L.push('', 'Ответы:'); qa.forEach(x => L.push('— ' + x[0], '  ' + x[1])); }
  return L.join('\n');
}

  const t = e.target.closest('[data-view],[data-pick],[data-yn],[data-open],.shot[data-full],[data-go]');
  if (!t) return;
  if (t.dataset.view) { st.view = t.dataset.view; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset.pick) { st.style = t.dataset.pick; save(); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Стиль выбран'); }
  else if (t.dataset.yn) { e.stopPropagation(); const id = t.dataset.yn; st.r[id] = st.r[id] === t.dataset.v ? '' : t.dataset.v; save();
    const el = document.getElementById('r_' + id); el.querySelector('.yn').outerHTML = yn(id); el.classList.toggle('no', st.r[id] === 'n'); }
  else if (t.dataset.open) { const id = t.dataset.open; st.open[id] = !st.open[id]; save(); document.getElementById('r_' + id).classList.toggle('open', !!st.open[id]); }
  else if (t.dataset.go) { st.open[t.dataset.go] = true; save(); document.getElementById('r_' + t.dataset.go).classList.add('open'); }
  else if (t.dataset.full) { $('#lb img').src = t.dataset.full; $('#lb').classList.add('on'); }
});
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) st.note[t.dataset.note] = t.value;
  else if (t.dataset.q) st.q[t.dataset.q] = t.value;
  else return;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.swap) return;
  st.swap[t.dataset.swap] = t.value; save();
  const el = document.getElementById('r_' + t.dataset.swap);
  el.querySelector('.rt .t').textContent = t.value || allRolls().find(r => r.id === t.dataset.swap).t;
});
$('#copy').addEventListener('click', async () => {
  const s = text();
  try { await navigator.clipboard.writeText(s); toast('Скопировано'); }
  catch (e) { const a = document.createElement('textarea'); a.value = s; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); toast('Скопировано'); }
});
render();
</script>
</body>
</html>
